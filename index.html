<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pitch Analytics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            pitch: { 900: '#06140d', 800: '#0b2318', 700: '#123827', 500: '#1b5e3f', 400: '#22c55e' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-pitch-900 text-slate-100 min-h-screen font-sans antialiased p-6">
  <div class="max-w-6xl mx-auto space-y-6">
    <header class="flex justify-between items-center border-b border-pitch-700 pb-4">
      <h1 class="text-xl font-bold text-pitch-400 tracking-wider">PITCH//ANALYTICS</h1>
      <div class="text-sm text-slate-400">System Ready</div>
    </header>
    <main id="app" class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div id="fixtures" class="md:col-span-1 bg-pitch-800 border border-pitch-700 rounded-lg p-4">
        <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider mb-4">Upcoming Fixtures</h2>
        <div id="fixtures-list" class="space-y-3 text-sm text-slate-400">Loading fixtures...</div>
      </div>
      <div id="analytics" class="md:col-span-2 bg-pitch-800 border border-pitch-700 rounded-lg p-4">
        <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider mb-4">Match Analysis</h2>
        <div id="analysis-content" class="text-sm text-slate-400">Select a fixture to generate analysis.</div>
      </div>
    </main>
  </div>
</body>
</html>

name: Fetch soccer fixtures
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: Date YYYY-MM-DD
        required: false
        type: string
  repository_dispatch:
    types: [fetch_matches]
permissions:
  contents: write
concurrency:
  group: muno-fixtures
  queue: max
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4
      - name: Resolve date
        id: date
        env:
          INPUT_DATE: ${{ inputs.date }}
          EVENT_DATE: ${{ github.event.client_payload.date }}
        run: |
          D="$INPUT_DATE"
          if [ -z "$D" ]; then D="$EVENT_DATE"; fi
          if [ -z "$D" ]; then D=$(date -u +%F); fi
          python -c "from datetime import datetime; datetime.strptime('$D','%Y-%m-%d')"
          echo "date=$D" >> "$GITHUB_OUTPUT"
      - name: Fetch fixtures
        run: python scripts/fetch_fixtures.py --date "${{ steps.date.outputs.date }}"
      - name: Commit fixture data
        run: |
          git config user.name muno-actions
          git config user.email actions@users.noreply.github.com
          git add data/matches.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh fixtures for ${{ steps.date.outputs.date }}"
            git push origin main
          else
            echo "No fixture changes."
          fi
      - name: Trigger analysis pipeline
        env:
          MUNO_GITHUB_PAT: ${{ secrets.MUNO_GITHUB_PAT }}
        run: |
          if [ -z "$MUNO_GITHUB_PAT" ]; then
            echo "MUNO_GITHUB_PAT repository secret is not configured."
            exit 1
          fi
          sleep 5
          curl --fail-with-body --silent --show-error             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $MUNO_GITHUB_PAT"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${{ github.repository }}/dispatches"             -d '{"event_type":"analyze_match","client_payload":{"reason":"fixtures_refreshed","date":"${{ steps.date.outputs.date }}"}}'
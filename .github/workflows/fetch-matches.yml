name: Fetch soccer fixtures\n\non:\n  schedule:\n    - cron: "17 */6 * * *"\n  workflow_dispatch:\n    inputs:\n      date:\n        description: Date YYYY-MM-DD\n        required: false\n        type: string\n  repository_dispatch:\n    types: [fetch_matches]\n\npermissions:\n  contents: write\n\nconcurrency:\n  group: muno-data\n  cancel-in-progress: false\n\njobs:\n  fetch:\n    runs-on: ubuntu-latest\n    timeout-minutes: 90\n    steps:\n      - name: Checkout repository\n        uses: actions/checkout@v4\n        with:\n          fetch-depth: 0\n\n      - name: Set up Python\n        uses: actions/setup-python@v5\n        with:\n          python-version: "3.12"\n\n      - name: Install Browser Use and Chromium\n        run: |\n          python -m pip install --upgrade pip\n          python -m pip install browser-use\n          python -m playwright install --with-deps chromium\n\n      - name: Resolve date\n        id: date\n        env:\n          INPUT_DATE: ${{ inputs.date }}\n          EVENT_DATE: ${{ github.event.client_payload.date }}\n        shell: bash\n        run: |\n          set -euo pipefail\n          D="${INPUT_DATE:-${EVENT_DATE:-$(date -u +%F)}}"\n          python - "$D" <<'PY'\n          import sys\n          from datetime import datetime\n          datetime.strptime(sys.argv[1], "%Y-%m-%d")\n          PY\n          echo "date=$D" >> "$GITHUB_OUTPUT"\n          echo "Using fixture date: $D"\n\n      - name: Run MUNO Browser Use fixture agent\n        env:\n          OPENROUTER_KEYS_JSON: ${{ secrets.OPENROUTER_KEYS_JSON }}\n        run: |\n          set -euo pipefail\n          if [ -z "${OPENROUTER_KEYS_JSON:-}" ]; then\n            echo "ERROR: OPENROUTER_KEYS_JSON repository secret is not configured." >&2\n            exit 1\n          fi\n          python scripts/browser_fixture_agent.py --date "${{ steps.date.outputs.date }}"\n\n      - name: Validate browser-collected fixtures\n        env:\n          TARGET_DATE: ${{ steps.date.outputs.date }}\n        run: |\n          set -euo pipefail\n          python - <<'PY'\n          import json, os, sys\n          target = os.environ["TARGET_DATE"]\n          with open("data/matches.json", encoding="utf-8") as f:\n              data = json.load(f)\n          matches = data if isinstance(data, list) else data.get("matches", [])\n          target_matches = [m for m in matches if m.get("date") == target]\n          if not target_matches:\n              print(f"ERROR: Browser Use found no verified fixtures for {target}", file=sys.stderr)\n              sys.exit(1)\n          print(f"Validated {len(target_matches)} browser-collected fixtures for {target}")\n          PY\n\n      - name: Commit fixture data\n        run: |\n          set -euo pipefail\n          git config user.name "muno-actions"\n          git config user.email "actions@users.noreply.github.com"\n          git add data/matches.json data/browser_fixtures.json\n          if git diff --cached --quiet; then\n            echo "Fixture data is already current."\n          else\n            git commit -m "data: refresh browser-collected fixtures for ${{ steps.date.outputs.date }}"\n            git push origin main\n          fi\n\n      - name: Analyze fixtures\n        env:\n          OPENROUTER_KEYS_JSON: ${{ secrets.OPENROUTER_KEYS_JSON }}\n          TARGET_DATE: ${{ steps.date.outputs.date }}\n        run: |\n          set -euo pipefail\n          python - <<'PY'\n          import json, os, subprocess, sys\n          target = os.environ["TARGET_DATE"]\n          with open("data/matches.json", encoding="utf-8") as f:\n              data = json.load(f)\n          matches = data if isinstance(data, list) else data.get("matches", [])\n          matches = [m for m in matches if m.get("date") == target]\n          failures = 0\n          for match in matches:\n              home = match.get("home_team", {})\n              away = match.get("away_team", {})\n              home = home.get("name") if isinstance(home, dict) else home\n              away = away.get("name") if isinstance(away, dict) else away\n              match_id = match.get("match_id") or match.get("id")\n              if not match_id or not home or not away:\n                  failures += 1\n                  continue\n              result = subprocess.run([sys.executable, "scripts/analyze_match.py", "--match-id", str(match_id), "--home", str(home), "--away", str(away)])\n              if result.returncode != 0:\n                  failures += 1\n          if failures:\n              print(f"{failures} analysis job(s) failed.", file=sys.stderr)\n              sys.exit(1)\n          PY\n\n      - name: Commit analysis data\n        run: |\n          set -euo pipefail\n          git config user.name "muno-actions"\n          git config user.email "actions@users.noreply.github.com"\n          git add data/analyses/\n          if git diff --cached --quiet; then\n            echo "No analysis changes."\n          else\n            git commit -m "data: refresh match analysis for ${{ steps.date.outputs.date }}"\n            git push origin main\n          fi\n
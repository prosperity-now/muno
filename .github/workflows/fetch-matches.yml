name: Fetch soccer fixtures

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: Date YYYY-MM-DD
        required: false
        type: string
  repository_dispatch:
    types: [fetch_matches]

permissions:
  contents: write

concurrency:
  group: muno-fixtures
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests beautifulsoup4

      - name: Resolve date
        id: date
        env:
          INPUT_DATE: ${{ inputs.date }}
          EVENT_DATE: ${{ github.event.client_payload.date }}
        shell: bash
        run: |
          set -euo pipefail
          D="${INPUT_DATE:-${EVENT_DATE:-$(date -u +%F)}}"
          python - "$D" <<'PY'
          import sys
          from datetime import datetime
          datetime.strptime(sys.argv[1], "%Y-%m-%d")
          PY
          echo "date=$D" >> "$GITHUB_OUTPUT"
          echo "Using fixture date: $D"

      - name: Fetch fixtures
        run: python scripts/fetch_fixtures.py --date "${{ steps.date.outputs.date }}"

      - name: Commit fixture data
        run: |
          set -e
          git config user.name "muno-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/matches.json
          if git diff --cached --quiet; then
            echo "No fixture changes."
          else
            git commit -m "data: refresh fixtures for ${{ steps.date.outputs.date }}"
            git push origin main
          fi

      - name: Analyze fixtures
        env:
          OPENROUTER_KEYS_JSON: ${{ secrets.OPENROUTER_KEYS_JSON }}
          TARGET_DATE: ${{ steps.date.outputs.date }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess, sys
          target = os.environ["TARGET_DATE"]
          with open("data/matches.json", encoding="utf-8") as f:
              data = json.load(f)
          matches = data if isinstance(data, list) else data.get("matches", [])
          matches = [m for m in matches if m.get("date") == target]
          print(f"Found {len(matches)} fixtures for {target}")
          failures = 0
          for m in matches:
              home = m.get("home_team", {})
              away = m.get("away_team", {})
              home = home.get("name") if isinstance(home, dict) else home
              away = away.get("name") if isinstance(away, dict) else away
              match_id = m.get("match_id") or m.get("id")
              if not match_id or not home or not away:
                  print("Skipping incomplete fixture:", m)
                  continue
              print(f"Analyzing: {home} vs {away}")
              result = subprocess.run([sys.executable, "scripts/analyze_match.py", "--match-id", str(match_id), "--home", str(home), "--away", str(away)])
              if result.returncode != 0:
                  failures += 1
          if failures:
              print(f"{failures} analysis job(s) failed.", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Commit analysis data
        run: |
          set -e
          git config user.name "muno-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/analyses/
          if git diff --cached --quiet; then
            echo "No analysis changes."
          else
            git commit -m "data: refresh match analysis for ${{ steps.date.outputs.date }}"
            git push origin main
          fi